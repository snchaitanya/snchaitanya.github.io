<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brief</title>
  <meta name="description" content="Top headlines every morning at 7: World, USA, India, Andhra Pradesh, Business, Sports and Pop Culture.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e3a8a'/%3E%3Cpath d='M16 20h32M16 30h32M16 40h20' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <p class="kicker">Daily Brief</p>
      <h1 id="dateline">Today's headlines</h1>
      <div class="meta">
        <span id="updated">Loading…</span>
        <label class="picker">
          <span class="sr">Choose a day</span>
          <select id="day"></select>
        </label>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="msg" class="msg" role="alert" hidden></p>

    <h2 class="group-title">Top stories</h2>
    <div class="grid" id="g-top" data-sections="world usa india andhra"></div>

    <h2 class="group-title">Business &amp; Sports</h2>
    <div class="grid two" id="g-mid" data-sections="business sports"></div>

    <h2 class="group-title">Pop Culture &amp; Entertainment</h2>
    <div class="grid one" id="g-pop" data-sections="entertainment"></div>
  </main>

  <footer class="wrap foot">
    Refreshed automatically every morning at 7:00 AM Pacific from Google News and publisher RSS feeds.
    <a href="../">snchaitanya.github.io</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
